name: "Workflow/Dispatch/StandaloneGroup/Windows"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_call:
    inputs:
      job-array:
        description: "The dispatch.json's windows_standalone.jobs.<name> array of dispatch jobs."
        type: string
        required: true

jobs:
  run-jobs:
    name: "${{ matrix.name }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.job-array) }}
    permissions:
      id-token: write
      contents: read
    runs-on: |-
      ${{ contains(fromJSON('["NVIDIA", "NVIDIA-dev"]'), github.repository_owner) &&
          matrix.runner || 'windows-latest' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run job
        uses: $/.github/actions/workflow-run-job-windows
        with:
          id:          ${{ matrix.id }}
          environment: ${{ matrix.environment }}
          command:     ${{ matrix.command }}
          image:       ${{ matrix.image }}
          runner:      ${{ matrix.runner }}
          cuda:        ${{ matrix.cuda }}
          host:        ${{ matrix.host }}
          gpu_count:   ${{ matrix.gpu_count }}
